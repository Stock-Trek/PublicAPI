[package]
name = "stock-trek"
version = "0.10.0"
edition = "2024"
description = "Stock Trek time-series analysis"
authors = ["stock-trek.com <stock-trek@proton.me>"]
license = "MIT"
repository = "https://github.com/Stock-Trek/stock-trek"
readme = "README.md"
categories = ["finance", "mathematics"]
keywords = [
  "algorithm",
  "bot",
  "crypto",
  "quant",
  "trading",
]

[lib]
name = "stock_trek"
crate-type = ["cdylib", "rlib"]

[dependencies]
hashbrown = { version = "0.17.1", features = ["serde"] }
regex = "1.12.3"
rust_decimal = "1.42.0"
serde = "1.0.228"
serde_json = {version = "1.0.149", features = ["float_roundtrip"] }
serde_with = "3.21.0"
stock-trek-types = "0.1.5"
strum = { version = "0.28.0", features = ["derive"] }
traitreg = "0.4.0"

[lints.clippy]
module_inception = "allow"

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
features = []
no-deps = true
targets = ["x86_64-unknown-linux-gnu"]
